# ============================================================
# Hermes Agent 配置模板
# 填上你的API Key就能用
# ============================================================

model:
  default: deepseek-v4-flash
  provider: deepseek

providers:
  # ⭐ DeepSeek — 国内直连，便宜，日常对话主力
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key: ""         # ← 填 DeepSeek API Key (platform.deepseek.com)
    model: deepseek-v4-flash
    api_mode: deepseek-v4-flash

  # 🖼️ OpenAI — 生图/备用，美国服务器直连
  # ⚠️ 关键：必须写 api_mode: openai，否则Hermes会发自定义参数导致400错误
  openai:
    base_url: https://api.openai.com/v1
    api_key: ""         # ← 填 OpenAI API Key (platform.openai.com)
    model: gpt-4o
    api_mode: openai

  # 🔀 OpenRouter — 接Claude/多模型（如需）
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: ""         # ← 填 OpenRouter Key (openrouter.ai/keys)
    model: anthropic/claude-sonnet-4

  # 🇨🇳 阿里云百炼 — 国内直连，TTS语音/图片识别
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ""         # ← 填 阿里云百炼 Key
    model: qwen2.5-vl-72b-instruct
    api_mode: dashscope

agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: medium
